<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Распредели слова по категориям</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #f0f4ff; min-height: 100vh; padding: 24px 16px; color: #1a1a2e; }
  h1 { text-align: center; font-size: 1.5rem; font-weight: 800; color: #3a3a6e; margin-bottom: 6px; }
  .subtitle { text-align: center; font-size: 0.9rem; color: #888; margin-bottom: 24px; }
  .word-bank { background: white; border-radius: 16px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .word-bank-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 12px; }
  .words-container { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
  .word-btn { background: #eef0ff; border: 2px solid #c5caf5; color: #3a3a8c; font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700; padding: 7px 16px; border-radius: 50px; cursor: pointer; transition: all 0.15s; user-select: none; }
  .word-btn:hover { background: #d8dbff; transform: translateY(-2px); }
  .word-btn.placed { opacity: 0; pointer-events: none; }
  .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media(max-width: 480px) { .categories { grid-template-columns: 1fr; } }
  .category { background: white; border-radius: 16px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); min-height: 140px; transition: box-shadow 0.2s; }
  .category.highlight { box-shadow: 0 0 0 3px rgba(100,149,237,0.4); }
  .category-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
  .category-emoji { font-size: 1.4rem; }
  .category-name { font-size: 0.95rem; font-weight: 800; color: #333; }
  .drop-zone { display: flex; flex-wrap: wrap; gap: 6px; min-height: 60px; border-radius: 10px; padding: 6px; }
  .placed-word { font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 700; padding: 5px 12px; border-radius: 50px; cursor: pointer; transition: all 0.15s; border: none; }
  .placed-word:hover { opacity: 0.75; }
  .cat-0 .placed-word { background: #ffd6d6; color: #c0392b; }
  .cat-1 .placed-word { background: #d6ffe8; color: #1e8449; }
  .cat-2 .placed-word { background: #fff3cd; color: #b7770d; }
  .cat-3 .placed-word { background: #d6eeff; color: #1a5276; }
  .cat-0 .category-header { border-color: #ffb3b3; }
  .cat-1 .category-header { border-color: #a3f0c0; }
  .cat-2 .category-header { border-color: #ffe89a; }
  .cat-3 .category-header { border-color: #a3d4ff; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .btn-check { background: #4a6cf7; color: white; border: none; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; padding: 12px 28px; border-radius: 50px; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 14px rgba(74,108,247,0.35); }
  .btn-check:hover { background: #3a5ce0; transform: translateY(-2px); }
  .btn-check:disabled { background: #aaa; box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-reset { background: white; color: #888; border: 2px solid #ddd; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700; padding: 12px 24px; border-radius: 50px; cursor: pointer; transition: all 0.15s; }
  .btn-reset:hover { border-color: #aaa; color: #555; }
  .feedback { text-align: center; font-size: 1rem; font-weight: 700; padding: 12px 20px; border-radius: 12px; margin-bottom: 16px; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4edda; color: #1e7e34; }
  .feedback.wrong { background: #fdecea; color: #c0392b; }
  .placed-word.correct-mark { outline: 2px solid #27ae60; }
  .placed-word.wrong-mark { outline: 2px solid #e74c3c; text-decoration: line-through; }
  .score-badge { display: inline-block; background: #4a6cf7; color: white; border-radius: 50px; padding: 2px 12px; font-size: 1rem; font-weight: 800; margin-left: 6px; }
  .submit-panel { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 20px; display: none; }
  .submit-panel.show { display: block; }
  .submit-panel h3 { font-size: 1rem; font-weight: 800; color: #3a3a6e; margin-bottom: 12px; }
  .name-input { width: 100%; padding: 10px 16px; border: 2px solid #c5caf5; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; color: #333; outline: none; transition: border 0.15s; margin-bottom: 12px; }
  .name-input:focus { border-color: #4a6cf7; }
  .btn-submit { width: 100%; background: #27ae60; color: white; border: none; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; padding: 12px; border-radius: 50px; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 14px rgba(39,174,96,0.3); }
  .btn-submit:hover { background: #219a52; transform: translateY(-2px); }
  .btn-submit:disabled { background: #aaa; box-shadow: none; cursor: not-allowed; transform: none; }
  .sent-msg { text-align: center; font-size: 1.1rem; font-weight: 800; color: #27ae60; padding: 16px; background: #d4edda; border-radius: 12px; margin-bottom: 16px; display: none; }
  .sent-msg.show { display: block; }
</style>
</head>
<body>

<h1>🗂 Распредели слова</h1>
<p class="subtitle">Нажми на слово — выбери категорию. Нажми на слово в категории — вернёт обратно.</p>

<div class="word-bank">
  <div class="word-bank-title">Слова для сортировки</div>
  <div class="words-container" id="wordBank"></div>
</div>

<div class="categories" id="categoriesGrid"></div>

<div class="btn-row">
  <button class="btn-check" id="btnCheck" onclick="checkAnswers()">✅ Проверить</button>
  <button class="btn-reset" onclick="resetAll()">🔄 Сначала</button>
</div>

<div class="feedback" id="feedback"></div>

<div class="submit-panel" id="submitPanel">
  <h3>📤 Отправить результат учителю</h3>
  <input class="name-input" id="studentName" type="text" placeholder="Введи своё имя..." maxlength="50" />
  <button class="btn-submit" id="btnSubmit" onclick="submitResult()">Отправить учителю</button>
</div>

<div class="sent-msg" id="sentMsg">✅ Готово! Результат отправлен учителю.</div>

<script>
// ============================================================
// ШАГ 1: ВСТАВЬ СЮДА СВОЮ ССЫЛКУ НА ГУГЛ СКРИПТ
// Выглядит так: https://script.google.com/macros/s/XXXX/exec
// ============================================================
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvhhDWT-uo1RAK3oZZFEIrbbqhZg__Y5toK1EIWMKkwyub7PwNY1XEX9SjkGuZ4WL2_w/exec";

// ============================================================
// ШАГ 2: ИЗМЕНИ ЗАДАНИЕ ПОД СВОЙ ПРЕДМЕТ
// ============================================================
const TASK = {
  name: "Сортировка слов",
  categories: [
    { name: "Животные",  emoji: "🐾", words: ["кот","собака","слон","лиса","волк","медведь"] },
    { name: "Фрукты",    emoji: "🍎", words: ["яблоко","банан","груша","манго","слива","лимон"] },
    { name: "Цвета",     emoji: "🎨", words: ["красный","синий","жёлтый","зелёный","белый","чёрный"] },
    { name: "Транспорт", emoji: "🚗", words: ["машина","автобус","самолёт","корабль","велосипед","поезд"] },
  ]
};
// ============================================================

let allWords = [], placed = {}, lastResult = null;

function init() {
  allWords = TASK.categories.flatMap(c => c.words).sort(() => Math.random() - 0.5);
  placed = {}; lastResult = null;
  document.getElementById('submitPanel').className = 'submit-panel';
  document.getElementById('sentMsg').className = 'sent-msg';
  document.getElementById('studentName').value = '';
  document.getElementById('btnCheck').disabled = false;
  document.getElementById('btnSubmit').textContent = 'Отправить учителю';
  render();
}

function render() {
  const bank = document.getElementById('wordBank');
  bank.innerHTML = '';
  allWords.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'word-btn' + (placed[w] !== undefined ? ' placed' : '');
    btn.textContent = w;
    btn.onclick = () => handleWordClick(w, btn);
    bank.appendChild(btn);
  });
  const grid = document.getElementById('categoriesGrid');
  grid.innerHTML = '';
  TASK.categories.forEach((cat, ci) => {
    const div = document.createElement('div');
    div.className = `category cat-${ci}`;
    div.innerHTML = `<div class="category-header"><span class="category-emoji">${cat.emoji}</span><span class="category-name">${cat.name}</span></div><div class="drop-zone" id="zone-${ci}"></div>`;
    grid.appendChild(div);
  });
  Object.entries(placed).forEach(([w, ci]) => addToZone(w, ci));
  document.getElementById('feedback').className = 'feedback';
}

function handleWordClick(word, btn) {
  if (placed[word] !== undefined) return;
  document.querySelectorAll('.category').forEach((el, i) => {
    el.style.cursor = 'pointer';
    el.classList.add('highlight');
    el.onclick = () => placeWord(word, i, btn);
  });
  btn.style.background = '#c5caf5';
  setTimeout(() => document.addEventListener('click', cancelPending, { once: true }), 10);
}

function cancelPending(e) {
  if (!e.target.closest('.category') && !e.target.closest('.word-btn')) {
    clearHighlights();
    document.querySelectorAll('.word-btn').forEach(b => b.style.background = '');
  }
}

function placeWord(word, ci, btn) {
  placed[word] = ci;
  clearHighlights();
  btn.classList.add('placed'); btn.style.background = '';
  addToZone(word, ci);
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('submitPanel').className = 'submit-panel';
}

function addToZone(word, ci) {
  const zone = document.getElementById(`zone-${ci}`);
  if (!zone) return;
  const span = document.createElement('button');
  span.className = 'placed-word'; span.textContent = word; span.title = 'Нажми, чтобы вернуть';
  span.onclick = () => removeFromZone(word, ci, span);
  zone.appendChild(span);
}

function removeFromZone(word, ci, el) {
  delete placed[word]; el.remove();
  document.querySelectorAll('.word-btn').forEach(b => { if (b.textContent === word) b.classList.remove('placed'); });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('submitPanel').className = 'submit-panel';
}

function clearHighlights() {
  document.querySelectorAll('.category').forEach(el => { el.classList.remove('highlight'); el.style.cursor = ''; el.onclick = null; });
}

function checkAnswers() {
  let correct = 0, total = 0, errors = [];
  document.querySelectorAll('.placed-word').forEach(el => el.classList.remove('correct-mark','wrong-mark'));
  Object.entries(placed).forEach(([word, ci]) => {
    total++;
    const ok = TASK.categories[ci].words.includes(word);
    document.getElementById(`zone-${ci}`).querySelectorAll('.placed-word').forEach(el => {
      if (el.textContent === word) el.classList.add(ok ? 'correct-mark' : 'wrong-mark');
    });
    if (ok) correct++; else errors.push(`${word} → ${TASK.categories[ci].name}`);
  });
  const totalWords = allWords.length;
  lastResult = { correct, total, totalWords, errors };
  const fb = document.getElementById('feedback');
  if (total === 0) { fb.className = 'feedback wrong show'; fb.innerHTML = 'Сначала распредели хотя бы несколько слов!'; return; }
  if (correct === totalWords && total === totalWords) {
    fb.className = 'feedback correct show'; fb.innerHTML = `🎉 Отлично! Все ${totalWords} слов на своих местах!`;
  } else {
    fb.className = 'feedback wrong show'; fb.innerHTML = `Правильно: <span class="score-badge">${correct} / ${total}</span> — зачёркнутые слова стоят не там, попробуй ещё раз!`;
  }
  document.getElementById('submitPanel').className = 'submit-panel show';
  document.getElementById('sentMsg').className = 'sent-msg';
  document.getElementById('btnSubmit').disabled = false;
  document.getElementById('btnSubmit').textContent = 'Отправить учителю';
}

function submitResult() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) {
    document.getElementById('studentName').focus();
    document.getElementById('studentName').style.borderColor = '#e74c3c';
    setTimeout(() => document.getElementById('studentName').style.borderColor = '', 1500);
    return;
  }
  if (!lastResult) return;
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Отправляю...';
  const payload = {
    name: name,
    task: TASK.name,
    correct: lastResult.correct + " из " + lastResult.totalWords,
    total: lastResult.total,
    errors: lastResult.errors.length > 0 ? lastResult.errors.join(", ") : "нет ошибок"
  };
  fetch(SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('submitPanel').className = 'submit-panel';
    document.getElementById('sentMsg').className = 'sent-msg show';
    document.getElementById('btnCheck').disabled = true;
  }).catch(() => {
    btn.disabled = false; btn.textContent = 'Отправить учителю';
    alert('Ошибка отправки. Проверь интернет и попробуй снова.');
  });
}

init();
</script>
</body>
</html>
